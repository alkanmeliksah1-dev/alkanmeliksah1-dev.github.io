<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gallery — Melikşah Alkan</title>
  <meta name="description" content="Melikşah Alkan — Istanbul-based composer, flutist and sound designer.">
  <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/site.css">
  <script>try{if(localStorage.getItem('theme')==='dark')document.documentElement.setAttribute('data-theme','dark')}catch(e){}</script>
</head>
<body>
<main>

  <div class="wrap">
    <header class="page-head">
      <p class="eyebrow">Gallery</p>
      <h1>Photographs</h1>
    </header>
    <section class="block" style="padding-top:0">
      <!-- Fotoğrafları assets/images/gallery/ içine koy ve placeholder'ları şununla değiştir:
           <img src="assets/images/gallery/dosya.jpg" alt="Açıklama" loading="lazy"> -->
      <div class="gallery">
        <figure><div class="placeholder">Photo</div><figcaption>Caption</figcaption></figure>
        <figure><div class="placeholder" style="aspect-ratio:3/4">Photo</div><figcaption>Caption</figcaption></figure>
        <figure><div class="placeholder">Photo</div><figcaption>Caption</figcaption></figure>
        <figure><div class="placeholder" style="aspect-ratio:1">Photo</div><figcaption>Caption</figcaption></figure>
        <figure><div class="placeholder">Photo</div><figcaption>Caption</figcaption></figure>
        <figure><div class="placeholder" style="aspect-ratio:3/4">Photo</div><figcaption>Caption</figcaption></figure>
      </div>
    </section>
  </div>
</main>
<script src="assets/js/site.js"></script>
</body>
</html>
